# Reverse proxy przed Gunicornem: pliki statyczne serwuje Nginx, resztę przekazuje do Django
upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 5M;

    location /static/ {
        alias /static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare przekazuje oryginalny protokół (https)
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
}
